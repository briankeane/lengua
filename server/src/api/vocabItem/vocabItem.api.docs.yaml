paths:
  /v1/vocab-items:
    get:
      tags:
        - VocabItems
      summary: List the authenticated user's vocab items
      description: >
        Returns the authenticated user's saved vocab items, newest first
        (ordered by `createdAt` descending, with `id` as a stable tiebreak).
        Uses keyset (cursor) pagination: pass the `nextCursor` from a response
        back as the `cursor` query parameter to fetch the next page. A `null`
        `nextCursor` means there are no more items. Items added while paging do
        not shift or duplicate results. No total count is returned. Results are
        always scoped to the token's user; internal fields (`userId`,
        `targetTextNormalized`) are not exposed.
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: targetLanguageCode
          required: false
          schema:
            type: string
            example: es
          description: Optional exact filter, case-insensitive (canonicalized to lowercase).
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
          description: Maximum items to return. Must be an integer between 1 and 100.
        - in: query
          name: cursor
          required: false
          schema:
            type: string
          description: >
            Opaque pagination cursor from a previous response's `nextCursor`.
            Treat it as a token; do not construct or parse it.
      responses:
        '200':
          description: A page of the user's vocab items.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VocabItemList'
        '400':
          description: Invalid limit or malformed cursor, or an unknown query parameter
        '401':
          description: Authentication required
    post:
      tags:
        - VocabItems
      summary: Save a translated word or phrase
      description: >
        Saves a locally-translated word or phrase to the authenticated user's vocab
        list for later review. Idempotent per user: saving the same target text in the
        same language returns the existing item instead of creating a duplicate. The
        owning user is taken from the token; a `userId` in the body is ignored.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - targetLanguageCode
                - sourceText
                - targetText
              properties:
                targetLanguageCode:
                  type: string
                  maxLength: 20
                  description: Target language code (canonicalized to lowercase).
                  example: es
                sourceText:
                  type: string
                  maxLength: 512
                  description: The phrase in the user's language.
                  example: the dog
                targetText:
                  type: string
                  maxLength: 512
                  description: The phrase in the target language.
                  example: el perro
      responses:
        '201':
          description: A new vocab item was created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VocabItem'
        '200':
          description: A matching item already existed; the existing item is returned unchanged.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VocabItem'
        '400':
          description: Missing or empty required field
        '401':
          description: Authentication required
  /v1/vocab-items/{vocabItemId}:
    delete:
      tags:
        - VocabItems
      summary: Delete a vocab item
      description: >
        Permanently deletes one of the authenticated user's vocab items. The item
        must be owned by the token's user; deleting a non-existent item, or one
        owned by another user, returns 404 (the other user's item is left
        untouched and its existence is not revealed).
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: vocabItemId
          required: true
          schema:
            type: string
            format: uuid
          description: The id of the vocab item to delete.
      responses:
        '204':
          description: The item was deleted. No content is returned.
        '400':
          description: Malformed vocabItemId (not a UUID)
        '401':
          description: Authentication required
        '404':
          description: No vocab item with that id is owned by the authenticated user

components:
  schemas:
    VocabItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        targetLanguageCode:
          type: string
          example: es
        sourceText:
          type: string
          example: the dog
        targetText:
          type: string
          example: el perro
        targetTextNormalized:
          type: string
          example: el perro
        familiarity:
          type: integer
          example: 0
        lastSeenAt:
          type: string
          format: date-time
          nullable: true
        timesSeen:
          type: integer
          example: 0
        timesCorrect:
          type: integer
          example: 0
        timesIncorrect:
          type: integer
          example: 0
        lastOutcome:
          type: string
          nullable: true
        nextDueAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    VocabItemListItem:
      type: object
      description: >
        The public vocab item shape returned by list/read endpoints. Excludes
        internal fields (`userId`, `targetTextNormalized`).
      properties:
        id:
          type: string
          format: uuid
        targetLanguageCode:
          type: string
          example: es
        sourceText:
          type: string
          example: the dog
        targetText:
          type: string
          example: el perro
        familiarity:
          type: integer
          example: 0
        lastSeenAt:
          type: string
          format: date-time
          nullable: true
        timesSeen:
          type: integer
          example: 0
        timesCorrect:
          type: integer
          example: 0
        timesIncorrect:
          type: integer
          example: 0
        lastOutcome:
          type: string
          nullable: true
        nextDueAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    VocabItemList:
      type: object
      properties:
        vocabItems:
          type: array
          items:
            $ref: '#/components/schemas/VocabItemListItem'
        pagination:
          type: object
          properties:
            limit:
              type: integer
              example: 50
            nextCursor:
              type: string
              nullable: true
              description: Cursor for the next page, or null when there are no more items.
